<!DOCTYPE html>
<html>
<head>
    <title>Mohamed's Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 30px;
            margin: 0;
            color: black;
            transition: 0.4s;
        }

        /* Navigation */

        nav {
            margin-bottom: 25px;
            animation: fadeDown 1s ease;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            margin: 8px;
            display: inline-block;
            transition: 0.3s;
        }

        nav a:hover {
            color: blue;
            transform: translateY(-3px);
        }

        /* Main Card */

        .card {
            background-color: white;
            width: 90%;
            max-width: 550px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            animation: fadeUp 1s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Profile */

        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            animation: profileAnimation 1.5s ease;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 30px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        /* Buttons */

        button {
            background-color: #4da6ff;
            color: black;
            border: none;
            padding: 12px 20px;
            margin: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #3399ff;
            transform: scale(1.05);
        }

        .dark-button {
            background-color: #222;
            color: white;
        }

        /* Skills */

        .skills {
            margin-top: 30px;
        }

        .skill-box {
            background-color: #f2f2f2;
            padding: 15px;
            margin: 15px auto;
            border-radius: 12px;
            width: 90%;
            transition: 0.3s;
        }

        .skill-box:hover {
            transform: scale(1.03);
        }

        .skill-box p {
            font-weight: bold;
        }

        .progress-container {
            background-color: #ddd;
            width: 100%;
            height: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-html {
            background-color: #ff7043;
            width: 80%;
            height: 15px;
            animation: progressHTML 2s ease;
        }

        .progress-css {
            background-color: #42a5f5;
            width: 65%;
            height: 15px;
            animation: progressCSS 2s ease;
        }

        .progress-js {
            background-color: #fdd835;
            width: 40%;
            height: 15px;
            animation: progressJS 2s ease;
        }

        /* Contact */

        .contact {
            margin-top: 30px;
            padding-top: 10px;
        }

        .contact a {
            display: block;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            margin: 12px;
            transition: 0.3s;
        }

        .contact a:hover {
            color: blue;
            transform: scale(1.05);
        }

        /* Message */

        .message {
            font-weight: bold;
            color: blue;
            min-height: 25px;
        }

        /* Footer */

        footer {
            width: 90%;
            max-width: 550px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        footer p {
            margin: 5px;
            font-size: 14px;
        }

        /* Dark Mode */

        .dark-mode {
            background-color: #121212;
            color: white;
        }

        .dark-mode .card,
        .dark-mode footer {
            background-color: #1e1e1e;
        }

        .dark-mode p {
            color: white;
        }

        .dark-mode nav a {
            color: white;
        }

        .dark-mode .skill-box {
            background-color: #2a2a2a;
        }

        .dark-mode .contact a {
            color: white;
        }

        .dark-mode .message {
            color: #4da6ff;
        }
