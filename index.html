<!DOCTYPE html>
<html>
<head>
    <title>Mohamed's Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 50px;
            color: black;
            transition: 0.4s;
            margin: 0;
        }

        /* Navigation */

        nav {
            margin-bottom: 30px;
            animation: fadeDown 1s ease;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            margin: 15px;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        nav a:hover {
            color: blue;
            transform: translateY(-3px);
        }

        /* Main Card */

        .card {
            background-color: white;
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            animation: fadeUp 1s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Profile */

        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            animation: profileAnimation 2s ease;
        }

        /* Buttons */

        button {
            background-color: #4da6ff;
            color: black;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            background-color: #3399ff;
            transform: scale(1.05);
        }

        /* Text */

        p {
            font-size: 18px;
            color: black;
        }

        /* Skills */

        .skills {
            margin-top: 20px;
        }

        .skills p {
            font-weight: bold;
        }

        .skill-box {
            background-color: #f2f2f2;
            padding: 15px;
            margin: 15px auto;
            border-radius: 12px;
            width: 90%;
            transition: transform 0.3s ease;
            animation: fadeUp 1.2s ease;
        }

        .skill-box:hover {
            transform: scale(1.05);
        }

        .progress-container {
            background-color: #ddd;
            width: 100%;
            height: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-html {
            background-color: #ff7043;
            width: 80%;
            height: 15px;
            animation: progressHTML 2s ease;
        }

        .progress-css {
            background-color: #42a5f5;
            width: 65%;
            height: 15px;
            animation: progressCSS 2s ease;
        }

        .progress-js {
            background-color: #fdd835;
            width: 40%;
            height: 15px;
            animation: progressJS 2s ease;
        }

        /* Projects */

        .projects {
            margin-top: 40px;
        }

        .project-box {
            background-color: #f2f2f2;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            width: 90%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            animation: fadeUp 1.2s ease;
        }

        .project-box:hover {
            transform: translateY(-5px);
        }

        .project-box h4 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .project-box p {
            font-size: 16px;
        }

        /* Message */

        .message {
            font-weight: bold;
            color: blue;
            animation: fadeUp 0.5s ease;
        }

        /* Contact */

        .contact {
            margin-top: 30px;
        }

        .contact a {
            display: block;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            margin: 12px;
            transition: transform 0.3s ease;
        }

        .contact a:hover {
            color: blue;
            transform: scale(1.05);
        }

        /* Footer */

        footer {
            margin-top: 40px;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            font-size: 16px;
            animation: fadeUp 1.5s ease;
        }
