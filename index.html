<!DOCTYPE html>
<html>
<head>
    <title>Mohamed's Website</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 100px;
            color: black;
        }

        .card {
            background-color: white;
            width: 80%;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        button {
            background-color: #4da6ff;
            color: black;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #3399ff;
        }

        p {
            font-size: 18px;
            color: black;
        }

        a {
            color: black;
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img class="profile" src="https://i.pravatar.cc/150?img=12" alt="Mohamed">

        <h1>Hello Mohamed 👋</h1>

        <p>Welcome to my first website!</p>

        <h2>About Me</h2>

        <p>My name is Mohamed. I am learning programming.</p>

        <button>Click Me</button>

        <a href="https://www.google.com">Visit Google</a>

        <button onclick="showMessage()">About Me</button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
            "Hello! My name is Mohamed. Welcome to my website!";
        }
    </script>

</body>
</html>
